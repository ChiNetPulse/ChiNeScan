database_path = "~/.local/share/chinescan/chinescan.sqlite3"
log_level = "INFO"
# Optional; required before Stage B1 managed malware intake. Choose a dedicated local path.
# malware_managed_directory = "D:/chinescan-managed-samples"
malware_evidence_org_quota_bytes = 1073741824
# Governed local repository snapshot limits (90-day post-closure retention is fixed).
repository_snapshot_max_bytes = 5368709120
repository_snapshot_org_quota_bytes = 10737418240
# Filesystem browsing is disabled until local roots are explicitly approved.
# Use single-quoted TOML strings for Windows paths to preserve backslashes.
# allowed_roots = ['C:\src']
# extra_denied_paths = []
# allow_soft_denied = false
#
# Bounded scanning defaults (reserved for later project-scanning phases).
# max_files = 50000
# max_total_bytes = 1073741824
# max_file_bytes = 16777216
# max_depth = 32
# per_file_seconds = 2.0
# job_deadline_seconds = 300
# Additional code assessment exclusions (Git ignore syntax; built-in generated/vendor exclusions remain active).
# code_excluded_paths = ['generated/**', 'vendor/**']
#
# Public GitHub import is disabled by default. Enabling requires the Phase 6 managed-copy backend.
# github_import_enabled = false
# github_import_timeout_seconds = 120
# github_import_max_bytes = 524288000
# github_import_max_files = 50000
# github_import_max_projects = 20
